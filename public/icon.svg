<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Outer Glow & Gradient -->
    <linearGradient id="sgBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield Metallic Gradient -->
    <linearGradient id="sgShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="sgInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Emerald & Cyan Check Gradient -->
    <linearGradient id="sgCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Clock Ring Glow -->
    <linearGradient id="sgClockRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#sgBgGrad)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="8" />

  <!-- Outer Protective Shield (Guard) -->
  <path d="M 256 76 C 344 76 404 100 404 100 L 404 252 C 404 356 300 428 256 444 C 212 428 108 356 108 252 L 108 100 C 108 100 168 76 256 76 Z" 
        fill="url(#sgInnerGrad)" stroke="url(#sgShieldGrad)" stroke-width="14" stroke-linejoin="round" />

  <!-- Inner Shield Subtle Contour -->
  <path d="M 256 98 C 328 98 380 118 380 118 L 380 246 C 380 336 292 400 256 414 C 220 400 132 336 132 246 L 132 118 C 132 118 184 98 256 98 Z" 
        fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />

  <!-- Attendance Clock Face Ring (Time & Attendance) -->
  <circle cx="256" cy="246" r="92" fill="rgba(15, 23, 42, 0.85)" stroke="url(#sgClockRing)" stroke-width="10" />

  <!-- Clock Hour Ticks -->
  <line x1="256" y1="168" x2="256" y2="178" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="334" y1="246" x2="324" y2="246" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="324" x2="256" y2="314" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="178" y1="246" x2="188" y2="246" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <!-- Clock Hands (Shift Time: 9:00 Shift Start) -->
  <line x1="256" y1="246" x2="204" y2="246" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  <line x1="256" y1="246" x2="256" y2="194" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <circle cx="256" cy="246" r="8" fill="#818cf8" stroke="#ffffff" stroke-width="3" />

  <!-- Attendance Verified Checkmark Emblem (Verified Clock-in) -->
  <path d="M 210 286 L 250 326 L 350 206" fill="none" stroke="url(#sgCheckGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 210 286 L 250 326 L 350 206" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
